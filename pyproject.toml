[project]
name = "homebox-mcp"
version = "0.1.0"
description = "MCP server for Homebox inventory management system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "httpx",
    "python-dotenv",
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "respx",
    "ruff",
    "pytest",
    "anyio"
]

[project.scripts]
homebox-mcp = "homebox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ASYNC"]
ignore = []
